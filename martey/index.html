<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Legendary Martey">
  <title>Legendary Martey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Outfit:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <img class="brand-mark" src="assets/logo-mark.jpg" alt="Legendary Surf Guide Martey" onerror="this.style.display='none'">
      <div style="flex:1;min-width:0">
        <h1>Legendary Martey</h1>
        <p id="sub">Sultans <span>· North Male</span></p>
      </div>
      <div id="head-badge"></div>
    </header>
    <main>
      <div id="forecast"></div>
      <div id="map-pane" class="hidden"></div>
      <div id="spots" class="hidden"></div>
      <div id="chat" class="hidden"></div>
      <div id="meet" class="hidden"></div>
    </main>
    <nav class="nav" aria-label="Primary">
      <button data-tab="forecast">Forecast</button>
      <button data-tab="map">Map</button>
      <button data-tab="spots">Spots</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="meet">Meet</button>
    </nav>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="spots.js"></script>
  <script src="forecast.js"></script>
  <script src="app.js"></script>
</body>
</html>
